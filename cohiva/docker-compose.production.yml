services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      COHIVA_APP_URL: ${COHIVA_APP_URL}
      COHIVA_RTC_SECRET: ${COHIVA_RTC_SECRET}
      COHIVA_RTC_INTERNAL_URL: http://rtc:4100
      COHIVA_RTC_PUBLIC_URL: ${COHIVA_RTC_PUBLIC_URL}
      COHIVA_RECORDINGS_DIR: /data/recordings
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      - recordings_data:/data/recordings
    depends_on:
      rtc:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cohiva

  rtc:
    build:
      context: .
      dockerfile: Dockerfile.rtc
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      COHIVA_RTC_SECRET: ${COHIVA_RTC_SECRET}
      COHIVA_RTC_PORT: 4100
      COHIVA_RTC_MEDIA_PORT: 4101
      COHIVA_RTC_LISTEN_IP: 0.0.0.0
      COHIVA_RTC_ANNOUNCED_ADDRESS: ${COHIVA_PUBLIC_IP}
      COHIVA_RTC_ALLOWED_ORIGINS: ${COHIVA_RTC_ALLOWED_ORIGINS}
      COHIVA_TURN_URLS: ${COHIVA_TURN_URLS}
      COHIVA_TURN_SECRET: ${COHIVA_TURN_SECRET}
      COHIVA_TURN_CREDENTIAL_TTL_SECONDS: ${COHIVA_TURN_CREDENTIAL_TTL_SECONDS:-3600}
      COHIVA_RTC_ICE_TRANSPORT_POLICY: ${COHIVA_RTC_ICE_TRANSPORT_POLICY:-all}
    ports:
      - "4101:4101/tcp"
      - "4101:4101/udp"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cohiva

  turn:
    image: coturn/coturn:4.18.0-r0-debian
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${COHIVA_TURN_SECRET}
      - --realm=${COHIVA_RTC_DOMAIN}
      - --external-ip=${COHIVA_PUBLIC_IP}
      - --no-cli
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/tcp"
      - "49160-49200:49160-49200/udp"
    networks:
      - cohiva

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      COHIVA_APP_DOMAIN: ${COHIVA_APP_DOMAIN}
      COHIVA_RTC_DOMAIN: ${COHIVA_RTC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      rtc:
        condition: service_healthy
    networks:
      - cohiva

networks:
  cohiva:
    driver: bridge

volumes:
  recordings_data:
  caddy_data:
  caddy_config:
